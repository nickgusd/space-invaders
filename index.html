<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Futurama Space Invaders - Mobile Friendly</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none; /* Ensures precise touch control */
        }
        canvas {
            display: block;
            max-width: 1080px;
            width: 100%;
            height: 100%; /* Fallback */
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const maxWidth = 1080;
        function updateCanvasSize() {
            // Use visualViewport for mobile, fallback to innerHeight with safety check
            const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            const safeHeight = Math.max(height, 900); // Reduced to 900 for Chrome compatibility
            canvas.width = Math.min(window.innerWidth, maxWidth);
            canvas.height = safeHeight;
            console.log(`Canvas resized: ${canvas.width}x${canvas.height} (using ${window.visualViewport ? 'visualViewport' : 'innerHeight'})`);
        }
        updateCanvasSize();

        // Handle viewport changes (e.g., keyboard, orientation)
        window.addEventListener('resize', updateCanvasSize);
        window.visualViewport?.addEventListener('resize', updateCanvasSize);

        const backgroundImg = new Image();
        let backgroundLoaded = false;
        backgroundImg.onload = () => {
            backgroundLoaded = true;
            console.log('Background loaded. Width:', backgroundImg.width, 'Height:', backgroundImg.height);
        };
        backgroundImg.onerror = () => {
            console.error('Failed to load background image. Path:', backgroundImg.src);
        };
        backgroundImg.src = 'assets/grok_space.jpg';

        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 160, // Adjusted for Chrome (~160px from bottom)
            width: 50,
            height: 30,
            speed: 8,
            dx: 0,
            dy: 0,
            health: 100,
            maxHealth: 100,
            multiShot: 1,
            multiShotTimer: 0,
            score: 0,
            slurmCount: 0,
            hasLightsaber: false,
            lightsaberEnergy: 0,
            maxLightsaberEnergy: 300,
            lightsaberActive: false
        };
        player.y = Math.max(0, Math.min(canvas.height - player.height * 5.3, canvas.height - 160)); // Dynamic, ~160px from bottom

        let invaders = [];
        const invaderWidth = 60;
        const invaderHeight = 50;
        let baseInvaderSpeed = 0.5;

        const bullets = [];
        const bulletSpeed = -7;
        const enemyBullets = [];
        const enemyBulletSpeed = 5;

        let powerUps = [];
        const powerUpWidth = 30;
        const powerUpHeight = 30;

        let healthItems = [];
        const healthItemWidth = 40;
        const healthItemHeight = 40;

        let lightsaberItems = [];
        const lightsaberWidth = 40;
        const lightsaberHeight = 40;

        let level = 1;
        let isCharging = false;
        let chargeTime = 0;
        let rightPressed = false;
        let leftPressed = false;
        let upPressed = false;
        let downPressed = false;
        let spacePressed = false;

        // Touch variables
        let touchActive = false;
        let touchStartX = 0;
        let touchStartTime = 0;
        const touchHoldThreshold = 300; // Reduced from 500ms to make laser easier to trigger

        const omicronianImg = new Image();
        let omicronianLoaded = false;
        omicronianImg.onload = () => { omicronianLoaded = true; console.log('Omicronian SVG loaded'); };
        omicronianImg.onerror = () => { console.error('Failed to load Omicronian SVG:', omicronianImg.src); };
        omicronianImg.src = 'assets/Goal_Omicronian_Ship.svg';

        const alienImg = new Image();
        let alienLoaded = false;
        alienImg.onload = () => { alienLoaded = true; console.log('Alien SVG loaded'); };
        alienImg.onerror = () => { console.error('Failed to load Alien SVG:', alienImg.src); };
        alienImg.src = 'assets/alien-svgrepo-com.svg';

        const spacecraftImg = new Image();
        let spacecraftLoaded = false;
        spacecraftImg.onload = () => { spacecraftLoaded = true; console.log('Spacecraft SVG loaded'); };
        spacecraftImg.onerror = () => { console.error('Failed to load Spacecraft SVG:', spacecraftImg.src); };
        spacecraftImg.src = 'assets/spacecraft-svgrepo-com.svg';

        const blasterGunImg = new Image();
        let blasterGunLoaded = false;
        blasterGunImg.onload = () => { blasterGunLoaded = true; console.log('Blaster Gun SVG loaded'); };
        blasterGunImg.onerror = () => { console.error('Failed to load Blaster Gun SVG:', blasterGunImg.src); };
        blasterGunImg.src = 'assets/blaster-gun-svgrepo-com.svg';

        const alien2Img = new Image();
        let alien2Loaded = false;
        alien2Img.onload = () => { alien2Loaded = true; console.log('Alien2 SVG loaded'); };
        alien2Img.onerror = () => { console.error('Failed to load Alien2 SVG:', alien2Img.src); };
        alien2Img.src = 'assets/alien2-svgrepo-com.svg';

        const bossImg = new Image();
        let bossLoaded = false;
        bossImg.onload = () => { bossLoaded = true; console.log('Boss SVG loaded'); };
        bossImg.onerror = () => { console.error('Failed to load Boss SVG:', bossImg.src); };
        bossImg.src = 'assets/enemy_spacecraft.svg';

        const healthItemImg = new Image();
        let healthItemLoaded = false;
        healthItemImg.onload = () => { healthItemLoaded = true; console.log('Health Item SVG loaded'); };
        healthItemImg.onerror = () => { console.error('Failed to load Health Item SVG:', healthItemImg.src); };
        healthItemImg.src = 'assets/planet-svgrepo-com.svg';

        const lightsaberImg = new Image();
        let lightsaberLoaded = false;
        lightsaberImg.onload = () => { lightsaberLoaded = true; console.log('Lightsaber SVG loaded'); };
        lightsaberImg.onerror = () => { console.error('Failed to load Lightsaber SVG:', lightsaberImg.src); };
        lightsaberImg.src = 'assets/lightsaber-svgrepo-com.svg';

        // Touch event listeners
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            touchActive = true;
            touchStartX = touch.clientX;
            touchStartTime = performance.now();
            console.log(`Touch start at x: ${touchStartX}, y: ${touch.clientY}, time: ${touchStartTime}`);
            if (!isCharging) {
                isCharging = true;
                chargeTime = 0;
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) { // Ensure valid touch event
                e.preventDefault();
                if (touchActive) {
                    const touch = e.touches[0];
                    const deltaX = touch.clientX - touchStartX;
                    player.dx = deltaX > 0 ? player.speed : -player.speed;
                    if (Math.abs(deltaX) < 5) player.dx = 0; // Dead zone for jitter
                    console.log(`Touch move - deltaX: ${deltaX}, dx: ${player.dx}, player.x: ${player.x}, canvas.width: ${canvas.width}`);
                    touchStartX = touch.clientX;
                    player.x += player.dx; // Force update player.x here
                    player.x = Math.max(0, Math.min(canvas.width - player.width, player.x)); // Clamp to bounds
                }
            }
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            touchActive = false;
            player.dx = 0;
            const touchDuration = performance.now() - touchStartTime;
            console.log(`Touch end - duration: ${touchDuration}ms, lightsaberActive: ${player.lightsaberActive}, hasLightsaber: ${player.hasLightsaber}, energy: ${player.lightsaberEnergy}`);
            if (isCharging) {
                if (touchDuration < touchHoldThreshold) { // Tap: shoot bullets
                    if (!player.hasLightsaber || player.lightsaberEnergy <= 0) {
                        const bulletWidth = Math.min(chargeTime * 3, 30);
                        const bulletHeight = Math.min(chargeTime * 3, 50);
                        const spread = player.multiShot > 1 ? 15 : 0;
                        const shotCount = player.slurmCount >= 2 ? 5 : Math.min(3, level);
                        for (let i = 0; i < shotCount; i++) {
                            bullets.push({
                                x: player.x + player.width / 2 - bulletWidth / 2 + (i - (shotCount - 1) / 2) * spread,
                                y: player.y,
                                width: bulletWidth,
                                height: bulletHeight,
                                damage: bulletWidth / 4
                            });
                        }
                    }
                } else if (player.hasLightsaber && player.lightsaberEnergy > 0) { // Hold: activate laser
                    console.log(`Attempting to activate laser with duration: ${touchDuration}ms`);
                }
            }
            isCharging = false;
            chargeTime = 0;
            player.lightsaberActive = false; // Ensure laser deactivates on release
        });

        // Keyboard event listeners
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') rightPressed = true;
            else if (e.key === 'ArrowLeft') leftPressed = true;
            else if (e.key === 'ArrowUp') upPressed = true;
            else if (e.key === 'ArrowDown') downPressed = true;
            else if (e.key === ' ' && !isCharging) {
                spacePressed = true;
                isCharging = true;
                chargeTime = 0;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowRight') rightPressed = false;
            else if (e.key === 'ArrowLeft') leftPressed = false;
            else if (e.key === 'ArrowUp') upPressed = false;
            else if (e.key === 'ArrowDown') downPressed = false;
            else if (e.key === ' ') {
                spacePressed = false;
                if (isCharging && (!player.hasLightsaber || player.lightsaberEnergy <= 0)) {
                    const bulletWidth = Math.min(chargeTime * 3, 30);
                    const bulletHeight = Math.min(chargeTime * 3, 50);
                    const spread = player.multiShot > 1 ? 15 : 0;
                    const shotCount = player.slurmCount >= 2 ? 5 : Math.min(3, level);
                    for (let i = 0; i < shotCount; i++) {
                        bullets.push({
                            x: player.x + player.width / 2 - bulletWidth / 2 + (i - (shotCount - 1) / 2) * spread,
                            y: player.y,
                            width: bulletWidth,
                            height: bulletHeight,
                            damage: bulletWidth / 4
                        });
                    }
                }
                isCharging = false;
                chargeTime = 0;
                player.lightsaberActive = false; // Ensure laser deactivates on release
            }
        });

        function spawnInvaders() {
            invaders = [];
            bossDefeatedThisLevel = false;

            if (level >= 10 && (level % 5 === 0)) {
                const bossCount = level >= 25 ? 2 : 1;
                for (let i = 0; i < bossCount; i++) {
                    invaders.push({
                        x: canvas.width / 2 - 75 + (i * 200 - (bossCount - 1) * 100),
                        y: 50,
                        width: 150,
                        height: 100,
                        alive: true,
                        dx: (Math.random() - 0.5) * 10,
                        dy: baseInvaderSpeed * 0.75,
                        type: 'boss',
                        health: 80,
                        maxHealth: 80,
                        hitThisFrame: false,
                        shootTimer: Math.random() * 30 + 15
                    });
                }
            } else {
                let invaderCount = Math.min(15 + level, 25);
                let omicronianChance = Math.max(0.9 - level * 0.03, 0.3);
                let alien2Chance = Math.min(level * 0.02, 0.5);

                for (let i = 0; i < invaderCount; i++) {
                    let type = 'omicronian';
                    let width = invaderWidth;
                    let height = invaderHeight;
                    let speedMultiplier = 0.8;
                    let maxHealth = 1 + Math.floor(level / 5);

                    const rand = Math.random();
                    if (rand < alien2Chance && level >= 5) {
                        type = 'robotDevil';
                        width = 50;
                        height = 50;
                        speedMultiplier = 1.6;
                        maxHealth = 8 + Math.floor(level / 5);
                    } else if (rand > omicronianChance && level >= 3) {
                        type = 'brainSlug';
                        width = 40;
                        height = 40;
                        speedMultiplier = 1.2;
                        maxHealth = 2 + Math.floor(level / 5);
                    }

                    invaders.push({
                        x: Math.random() * (canvas.width - width),
                        y: Math.random() * 100,
                        width: width,
                        height: height,
                        alive: true,
                        dx: (Math.random() - 0.5) * 10,
                        dy: baseInvaderSpeed * speedMultiplier,
                        type: type,
                        health: maxHealth,
                        maxHealth: maxHealth,
                        hitThisFrame: false,
                        shootTimer: type === 'robotDevil' ? Math.random() * 90 + 45 : 0
                    });
                }

                if (level >= 14 && ((level - 14) % 7 === 0)) {
                    console.log(`Attempting to spawn lightsaber at Level ${level}`);
                    lightsaberItems.push({
                        x: Math.random() * (canvas.width - lightsaberWidth),
                        y: 0,
                        width: lightsaberWidth,
                        height: lightsaberHeight,
                        dy: 2
                    });
                }
            }
        }

        function spawnPowerUp() {
            const spawnChance = Math.min(0.005 + level * 0.002, 0.03);
            if (Math.random() < spawnChance && powerUps.length < 1) {
                powerUps.push({
                    x: Math.random() * (canvas.width - powerUpWidth),
                    y: 0,
                    width: powerUpWidth,
                    height: powerUpHeight,
                    dy: 2
                });
            }
        }

        function spawnHealthItem(x, y) {
            if (!bossDefeatedThisLevel && level >= 10 && (level % 10 === 0)) {
                console.log(`Spawning health item at Level ${level}, x: ${x}, y: ${y}`);
                console.log(`Before push - Health items count: ${healthItems.length}`);
                healthItems.push({
                    x: x,
                    y: y,
                    width: healthItemWidth,
                    height: healthItemHeight,
                    dy: 2,
                    spawnedFrame: performance.now()
                });
                console.log(`After push - Health items count: ${healthItems.length}`);
                bossDefeatedThisLevel = true;
            }
        }

        spawnInvaders();

        function update() {
            invaders.forEach(invader => invader.hitThisFrame = false);

            player.dx = 0;
            player.dy = 0;
            // Desktop keyboard movement
            if (rightPressed && player.x < canvas.width - player.width) player.dx = player.speed;
            if (leftPressed && player.x > 0) player.dx = -player.speed;
            if (upPressed && player.y > 0) player.dy = -player.speed;
            if (downPressed && player.y < canvas.height - player.height) player.dy = player.speed;

            // Mobile touch movement (overrides dx only)
            if (touchActive) {
                player.x += player.dx; // Ensure movement applies immediately
                player.x = Math.max(0, Math.min(canvas.width - player.width, player.x)); // Clamp to bounds
            }

            player.x += player.dx;
            player.y += player.dy;
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

            if (isCharging && (!player.hasLightsaber || player.lightsaberEnergy <= 0)) {
                chargeTime += 0.5;
            }

            // Update laser activation for touch/keyboard
            player.lightsaberActive = (player.hasLightsaber && player.lightsaberEnergy > 0) && 
                (spacePressed || (touchActive && performance.now() - touchStartTime > touchHoldThreshold));

            if (player.multiShotTimer > 0) {
                player.multiShotTimer--;
                if (player.multiShotTimer <= 0) player.multiShot = 1;
            }

            if (player.lightsaberActive) {
                player.lightsaberEnergy--;
                console.log(`Laser active, energy: ${player.lightsaberEnergy}`);
                if (player.lightsaberEnergy <= 0) {
                    player.hasLightsaber = false;
                    player.lightsaberActive = false;
                }
            }

            bullets.forEach((bullet, index) => {
                bullet.y += bulletSpeed;
                if (bullet.y < 0) bullets.splice(index, 1);
            });

            enemyBullets.forEach((bullet, index) => {
                bullet.y += enemyBulletSpeed;
                if (bullet.y > canvas.height) {
                    enemyBullets.splice(index, 1);
                } else if (
                    bullet.x < player.x + player.width &&
                    bullet.x + bullet.width > player.x &&
                    bullet.y < player.y + player.height &&
                    bullet.y + bullet.height > player.y
                ) {
                    player.health -= 5;
                    enemyBullets.splice(index, 1);
                }
            });

            console.log(`Before healthItems update - Count: ${healthItems.length}`);
            healthItems.forEach((item, index) => {
                console.log(`Health item position: x=${item.x}, y=${item.y}`);
                item.y += item.dy;
                if (performance.now() - item.spawnedFrame > 100) {
                    if (
                        item.x < player.x + player.width &&
                        item.x + item.width > player.x &&
                        item.y < player.y + player.height &&
                        item.y + item.height > player.y
                    ) {
                        console.log(`Collected health item at x: ${item.x}, y: ${item.y}`);
                        player.health = Math.min(player.maxHealth, player.health + 50);
                        healthItems.splice(index, 1);
                    } else if (item.y > canvas.height) {
                        console.log(`Removing health item at y: ${item.y}`);
                        healthItems.splice(index, 1);
                    }
                }
            });
            console.log(`After healthItems update - Count: ${healthItems.length}`);

            lightsaberItems.forEach((item, index) => {
                item.y += item.dy;
                if (item.y > canvas.height) {
                    lightsaberItems.splice(index, 1);
                } else if (
                    item.x < player.x + player.width &&
                    item.x + item.width > player.x &&
                    item.y < player.y + player.height &&
                    item.y + item.height > player.y
                ) {
                    player.hasLightsaber = true;
                    player.lightsaberEnergy = player.maxLightsaberEnergy;
                    lightsaberItems.splice(index, 1);
                }
            });

            if (player.lightsaberActive) {
                invaders.forEach((invader, index) => {
                    if (invader.alive && !invader.hitThisFrame &&
                        invader.x + invader.width > player.x &&
                        invader.x < player.x + player.width &&
                        invader.y < player.y) {
                        invader.health -= 2;
                        invader.hitThisFrame = true;
                        if (invader.health <= 0) {
                            invader.alive = false;
                            player.score += invader.type === 'omicronian' ? 10 : invader.type === 'brainSlug' ? 20 : invader.type === 'robotDevil' ? 50 : 100;
                            if (invader.type === 'boss') {
                                spawnHealthItem(invader.x + invader.width / 2 - healthItemWidth / 2, invader.y + invader.height / 2);
                            }
                        }
                    }
                });
            }

            invaders.forEach((invader, index) => {
                if (invader.alive) {
                    invader.x += invader.dx;
                    invader.y += invader.dy;

                    if (invader.x + invader.width > canvas.width || invader.x < 0) {
                        invader.dx *= -1;
                        invader.dx += (Math.random() - 0.5) * 2;
                    }
                    if (Math.random() < 0.1) {
                        invader.dx = (Math.random() - 0.5) * 10;
                    }

                    if (invader.x < player.x + player.width &&
                        invader.x + invader.width > player.x &&
                        invader.y < player.y + player.height &&
                        invader.y + invader.height > player.y) {
                        player.health -= invader.type === 'omicronian' ? 10 : invader.type === 'brainSlug' ? 5 : invader.type === 'robotDevil' ? 15 : 20;
                        invaders.splice(index, 1);
                    }

                    if (invader.y + invader.height > canvas.height) {
                        player.health -= invader.type === 'omicronian' ? 5 : invader.type === 'brainSlug' ? 3 : invader.type === 'robotDevil' ? 7 : 10;
                        invaders.splice(index, 1);
                        spawnInvaders();
                    }

                    if (invader.type === 'robotDevil' || invader.type === 'boss') {
                        invader.shootTimer--;
                        if (invader.shootTimer <= 0) {
                            const bulletWidth = invader.type === 'boss' ? 20 : 10;
                            const bulletHeight = invader.type === 'boss' ? 20 : 10;
                            enemyBullets.push({
                                x: invader.x + invader.width / 2 - bulletWidth / 2,
                                y: invader.y + invader.height,
                                width: bulletWidth,
                                height: bulletHeight
                            });
                            invader.shootTimer = invader.type === 'robotDevil' ? Math.random() * 90 + 45 : Math.random() * 30 + 15;
                        }
                    }
                }
            });

            spawnPowerUp();
            powerUps.forEach((powerUp, index) => {
                powerUp.y += powerUp.dy;
                if (powerUp.y > canvas.height) {
                    powerUps.splice(index, 1);
                } else if (
                    powerUp.x < player.x + player.width &&
                    powerUp.x + powerUp.width > player.x &&
                    powerUp.y < player.y + player.height &&
                    powerUp.y + powerUp.height > player.y
                ) {
                    player.slurmCount++;
                    player.multiShot = player.slurmCount >= 2 ? 5 : Math.min(3, level);
                    powerUps.splice(index, 1);
                }
            });

            bullets.forEach((bullet, bIndex) => {
                invaders.forEach((invader, iIndex) => {
                    if (invader.alive && !invader.hitThisFrame &&
                        bullet.x < invader.x + invader.width &&
                        bullet.x + bullet.width > invader.x &&
                        bullet.y < invader.y + invader.height &&
                        bullet.y + bullet.height > invader.y) {
                        invader.health -= 1;
                        invader.hitThisFrame = true;
                        if (bullet.damage <= 4) bullets.splice(bIndex, 1);
                        if (invader.health <= 0) {
                            invader.alive = false;
                            player.score += invader.type === 'omicronian' ? 10 : invader.type === 'brainSlug' ? 20 : invader.type === 'robotDevil' ? 50 : 100;
                            if (invader.type === 'boss') {
                                spawnHealthItem(invader.x + invader.width / 2 - healthItemWidth / 2, invader.y + invader.height / 2);
                            }
                        }
                        return;
                    }
                });
            });

            const allDead = invaders.every(invader => !invader.alive);
            if (allDead) {
                level++;
                spawnInvaders();
            }

            if (player.health <= 0) {
                ctx.fillStyle = '#FFFFFF';
                ctx.font = '40px Arial';
                ctx.fillText('Game Over, Meatbag!', canvas.width / 2 - 150, canvas.height / 2);
                ctx.font = '20px Arial';
                ctx.fillText(`Final Score: ${player.score}`, canvas.width / 2 - 70, canvas.height / 2 + 40);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (backgroundLoaded) {
                ctx.drawImage(backgroundImg, 0, 0, canvas.width, canvas.height);
            }

            if (spacecraftLoaded) {
                ctx.drawImage(spacecraftImg, player.x, player.y, player.width, player.height);
            } else {
                ctx.fillStyle = '#00FF00';
                ctx.fillRect(player.x, player.y, player.width, player.height);
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText('Planet Express', player.x, player.y - 5);
            }

            if (isCharging && (!player.hasLightsaber || player.lightsaberEnergy <= 0)) {
                ctx.fillStyle = '#FFFF00';
                ctx.fillRect(player.x, player.y - 10, Math.min(chargeTime * 2, 50), 5);
            }

            if (player.lightsaberActive) {
                ctx.fillStyle = '#FF0000';
                ctx.fillRect(player.x + player.width / 2 - 5, 0, 10, player.y);
                console.log(`Rendering laser at x: ${player.x + player.width / 2 - 5}, y: 0 to ${player.y}`);
            }

            if (player.hasLightsaber && player.lightsaberEnergy > 0) {
                ctx.fillStyle = '#FF0000';
                ctx.fillRect(canvas.width - 210, 10, 200, 10);
                ctx.fillStyle = '#00FFFF';
                ctx.fillRect(canvas.width - 210, 10, (player.lightsaberEnergy / player.maxLightsaberEnergy) * 200, 10);
            }

            ctx.fillStyle = '#FF0000';
            ctx.fillRect(10, 50, 200, 20);
            ctx.fillStyle = '#00FF00';
            ctx.fillRect(10, 50, (player.health / player.maxHealth) * 200, 20);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = '16px Arial';
            ctx.fillText(`Health: ${player.health}`, 10, 45);

            invaders.forEach(invader => {
                if (invader.alive) {
                    if (invader.type === 'omicronian' && omicronianLoaded) {
                        ctx.drawImage(omicronianImg, invader.x, invader.y, invader.width, invader.height);
                    } else if (invader.type === 'brainSlug' && alienLoaded) {
                        ctx.drawImage(alienImg, invader.x, invader.y, invader.width, invader.height);
                    } else if (invader.type === 'robotDevil' && alien2Loaded) {
                        ctx.drawImage(alien2Img, invader.x, invader.y, invader.width, invader.height);
                    } else if (invader.type === 'boss' && bossLoaded) {
                        ctx.save();
                        ctx.translate(invader.x + invader.width / 2, invader.y + invader.height / 2);
                        ctx.scale(1, -1);
                        ctx.drawImage(bossImg, -invader.width / 2, -invader.height / 2, invader.width, invader.height);
                        ctx.restore();
                    } else if (invader.type === 'omicronian') {
                        ctx.fillStyle = '#FF00FF';
                        ctx.fillRect(invader.x, invader.y, invader.width, invader.height);
                    } else if (invader.type === 'brainSlug') {
                        ctx.fillStyle = '#00FFFF';
                        ctx.fillRect(invader.x, invader.y, invader.width, invader.height);
                    } else if (invader.type === 'robotDevil') {
                        ctx.fillStyle = '#FF4500';
                        ctx.fillRect(invader.x, invader.y, invader.width, invader.height);
                    } else { // Boss fallback
                        ctx.fillStyle = '#FF00FF';
                        ctx.fillRect(invader.x, invader.y, invader.width, invader.height);
                    }
                    if (invader.type === 'robotDevil' || invader.type === 'boss') {
                        ctx.fillStyle = '#FF0000';
                        ctx.fillRect(invader.x, invader.y - 10, invader.width, 5);
                        ctx.fillStyle = '#00FF00';
                        ctx.fillRect(invader.x, invader.y - 10, (invader.health / invader.maxHealth) * invader.width, 5);
                    }
                }
            });

            ctx.fillStyle = '#FFFF00';
            bullets.forEach(bullet => {
                ctx.beginPath();
                ctx.arc(bullet.x + bullet.width / 2, bullet.y + bullet.height / 2, bullet.width / 2, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.fillStyle = '#FF0000';
            enemyBullets.forEach(bullet => {
                ctx.beginPath();
                ctx.arc(bullet.x + bullet.width / 2, bullet.y + bullet.height / 2, bullet.width / 2, 0, Math.PI * 2);
                ctx.fill();
            });

            powerUps.forEach(powerUp => {
                if (blasterGunLoaded) {
                    ctx.drawImage(blasterGunImg, powerUp.x, powerUp.y, powerUp.width, powerUp.height);
                } else {
                    ctx.fillStyle = '#00FF00';
                    ctx.fillRect(powerUp.x, powerUp.y, powerUp.width, powerUp.height);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillText('Slurm', powerUp.x, powerUp.y - 5);
                }
            });

            lightsaberItems.forEach(item => {
                if (lightsaberLoaded) {
                    ctx.drawImage(lightsaberImg, item.x, item.y, item.width, item.height);
                } else {
                    ctx.fillStyle = '#FF00FF';
                    ctx.fillRect(item.x, item.y, item.width, item.height);
                }
            });

            healthItems.forEach(item => {
                if (healthItemLoaded) {
                    ctx.drawImage(healthItemImg, item.x, item.y, item.width, item.height);
                } else {
                    ctx.fillStyle = '#00FFFF';
                    ctx.fillRect(item.x, item.y, item.width, item.height);
                }
            });

            ctx.fillStyle = '#FFFFFF';
            ctx.font = '20px Arial';
            ctx.fillText(`Level: ${level}`, 10, 30);
            ctx.fillText(`Score: ${player.score}`, 10, 90);
            ctx.fillText(`Slurm Cans: ${player.slurmCount}`, 10, 110);
            if (player.multiShotTimer > 0) {
                ctx.fillText(`Multi-Shot: ${player.multiShot}`, 10, 70);
            }

            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
