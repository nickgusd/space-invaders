<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Futurama Space Invaders - Max Width and Boss</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            max-width: 1080px;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const maxWidth = 1080;
        canvas.width = Math.min(window.innerWidth, maxWidth);
        canvas.height = window.innerHeight;

        const backgroundImg = new Image();
        let backgroundLoaded = false;
        backgroundImg.onload = () => {
            backgroundLoaded = true;
            console.log('Background loaded. Width:', backgroundImg.width, 'Height:', backgroundImg.height);
        };
        backgroundImg.onerror = () => {
            console.error('Failed to load background image. Path:', backgroundImg.src);
        };
        backgroundImg.src = 'assets/grok_space.jpg';

        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 50,
            width: 50,
            height: 30,
            speed: 8,
            dx: 0,
            health: 100,
            maxHealth: 100,
            multiShot: 1,
            multiShotTimer: 0,
            score: 0,
            slurmCount: 0
        };

        let invaders = [];
        const invaderWidth = 60;
        const invaderHeight = 50;
        let baseInvaderSpeed = 0.5;

        const bullets = [];
        const bulletSpeed = -7;
        const enemyBullets = [];
        const enemyBulletSpeed = 5;

        let powerUps = [];
        const powerUpWidth = 30;
        const powerUpHeight = 30;

        let level = 1;
        let isCharging = false;
        let chargeTime = 0;
        let rightPressed = false;
        let leftPressed = false;
        let spacePressed = false;

        const omicronianImg = new Image();
        let omicronianLoaded = false;
        omicronianImg.onload = () => { omicronianLoaded = true; console.log('Omicronian SVG loaded'); };
        omicronianImg.onerror = () => { console.error('Failed to load Omicronian SVG:', omicronianImg.src); };
        omicronianImg.src = 'assets/Goal_Omicronian_Ship.svg';

        const alienImg = new Image();
        let alienLoaded = false;
        alienImg.onload = () => { alienLoaded = true; console.log('Alien SVG loaded'); };
        alienImg.onerror = () => { console.error('Failed to load Alien SVG:', alienImg.src); };
        alienImg.src = 'assets/alien-svgrepo-com.svg';

        const spacecraftImg = new Image();
        let spacecraftLoaded = false;
        spacecraftImg.onload = () => { spacecraftLoaded = true; console.log('Spacecraft SVG loaded'); };
        spacecraftImg.onerror = () => { console.error('Failed to load Spacecraft SVG:', spacecraftImg.src); };
        spacecraftImg.src = 'assets/spacecraft-svgrepo-com.svg';

        const blasterGunImg = new Image();
        let blasterGunLoaded = false;
        blasterGunImg.onload = () => { blasterGunLoaded = true; console.log('Blaster Gun SVG loaded'); };
        blasterGunImg.onerror = () => { console.error('Failed to load Blaster Gun SVG:', blasterGunImg.src); };
        blasterGunImg.src = 'assets/blaster-gun-svgrepo-com.svg';

        const alien2Img = new Image();
        let alien2Loaded = false;
        alien2Img.onload = () => { alien2Loaded = true; console.log('Alien2 SVG loaded'); };
        alien2Img.onerror = () => { console.error('Failed to load Alien2 SVG:', alien2Img.src); };
        alien2Img.src = 'assets/alien2-svgrepo-com.svg';

        const bossImg = new Image();
        let bossLoaded = false;
        bossImg.onload = () => { bossLoaded = true; console.log('Boss SVG loaded'); };
        bossImg.onerror = () => { console.error('Failed to load Boss SVG:', bossImg.src); };
        bossImg.src = 'assets/enemy_spacecraft.svg';

        window.addEventListener('resize', () => {
            canvas.width = Math.min(window.innerWidth, maxWidth);
            canvas.height = window.innerHeight;
            player.x = canvas.width / 2 - 25;
            player.y = canvas.height - 50;
        });

        function spawnInvaders() {
            invaders = [];
            let invaderCount = 5 + level * 2;

            if (level === 10) {
                invaders.push({
                    x: canvas.width / 2 - 75,
                    y: 50,
                    width: 150,
                    height: 100,
                    alive: true,
                    dx: (Math.random() - 0.5) * 8,
                    dy: baseInvaderSpeed * 2,
                    type: 'boss',
                    health: 40, // 5x Alien2's 8
                    maxHealth: 40,
                    hitThisFrame: false,
                    shootTimer: Math.random() * 30 + 15
                });
            } else {
                for (let i = 0; i < invaderCount; i++) {
                    let type = 'omicronian';
                    let width = invaderWidth;
                    let height = invaderHeight;
                    let speedMultiplier = 1;
                    let maxHealth = 1;

                    if (level >= 3 && Math.random() < 0.2) {
                        type = 'brainSlug';
                        width = 40;
                        height = 40;
                        speedMultiplier = 1.5;
                    } else if (level >= 5 && Math.random() < 0.15) {
                        type = 'robotDevil';
                        width = 50;
                        height = 50;
                        speedMultiplier = 2;
                        maxHealth = 8;
                    }

                    invaders.push({
                        x: Math.random() * (canvas.width - width),
                        y: Math.random() * 100,
                        width: width,
                        height: height,
                        alive: true,
                        dx: (Math.random() - 0.5) * 8,
                        dy: baseInvaderSpeed * speedMultiplier,
                        type: type,
                        health: maxHealth,
                        maxHealth: maxHealth,
                        hitThisFrame: false,
                        shootTimer: type === 'robotDevil' ? Math.random() * 90 + 45 : 0
                    });
                }
            }
        }

        function spawnPowerUp() {
            const spawnChance = Math.min(0.005 + level * 0.002, 0.03);
            if (Math.random() < spawnChance && powerUps.length < 1) {
                powerUps.push({
                    x: Math.random() * (canvas.width - powerUpWidth),
                    y: 0,
                    width: powerUpWidth,
                    height: powerUpHeight,
                    dy: 2
                });
            }
        }

        spawnInvaders();

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') rightPressed = true;
            else if (e.key === 'ArrowLeft') leftPressed = true;
            else if (e.key === ' ' && !isCharging) {
                spacePressed = true;
                isCharging = true;
                chargeTime = 0;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowRight') rightPressed = false;
            else if (e.key === 'ArrowLeft') leftPressed = false;
            else if (e.key === ' ') {
                spacePressed = false;
                if (isCharging) {
                    const bulletWidth = Math.min(chargeTime * 3, 30);
                    const bulletHeight = Math.min(chargeTime * 3, 50);
                    const spread = player.multiShot > 1 ? 15 : 0;
                    const shotCount = player.slurmCount >= 2 ? 5 : Math.min(3, level);
                    for (let i = 0; i < shotCount; i++) {
                        bullets.push({
                            x: player.x + player.width / 2 - bulletWidth / 2 + (i - (shotCount - 1) / 2) * spread,
                            y: player.y,
                            width: bulletWidth,
                            height: bulletHeight,
                            damage: bulletWidth / 4
                        });
                    }
                    isCharging = false;
                    chargeTime = 0;
                }
            }
        });

        function update() {
            invaders.forEach(invader => invader.hitThisFrame = false);

            player.dx = 0;
            if (rightPressed && player.x < canvas.width - player.width) player.dx = player.speed;
            if (leftPressed && player.x > 0) player.dx = -player.speed;
            player.x += player.dx;

            if (isCharging) {
                chargeTime += 0.5;
            }

            if (player.multiShotTimer > 0) {
                player.multiShotTimer--;
                if (player.multiShotTimer <= 0) player.multiShot = 1;
            }

            bullets.forEach((bullet, index) => {
                bullet.y += bulletSpeed;
                if (bullet.y < 0) bullets.splice(index, 1);
            });

            enemyBullets.forEach((bullet, index) => {
                bullet.y += enemyBulletSpeed;
                if (bullet.y > canvas.height) {
                    enemyBullets.splice(index, 1);
                } else if (
                    bullet.x < player.x + player.width &&
                    bullet.x + bullet.width > player.x &&
                    bullet.y < player.y + player.height &&
                    bullet.y + bullet.height > player.y
                ) {
                    player.health -= 5;
                    enemyBullets.splice(index, 1);
                }
            });

            invaders.forEach((invader, index) => {
                if (invader.alive) {
                    invader.x += invader.dx;
                    invader.y += invader.dy;

                    if (invader.x + invader.width > canvas.width || invader.x < 0) {
                        invader.dx *= -1;
                        invader.dx += (Math.random() - 0.5) * 2;
                    }
                    if (Math.random() < 0.1) {
                        invader.dx = (Math.random() - 0.5) * 8;
                    }

                    if (invader.x < player.x + player.width &&
                        invader.x + invader.width > player.x &&
                        invader.y < player.y + player.height &&
                        invader.y + invader.height > player.y) {
                        player.health -= invader.type === 'omicronian' ? 10 : invader.type === 'brainSlug' ? 5 : invader.type === 'robotDevil' ? 15 : 20;
                        invaders.splice(index, 1);
                    }

                    if (invader.y + invader.height > canvas.height) {
                        player.health -= invader.type === 'omicronian' ? 5 : invader.type === 'brainSlug' ? 3 : invader.type === 'robotDevil' ? 7 : 10;
                        invaders.splice(index, 1);
                        spawnInvaders();
                    }

                    if (invader.type === 'robotDevil' || invader.type === 'boss') {
                        invader.shootTimer--;
                        if (invader.shootTimer <= 0) {
                            const bulletWidth = invader.type === 'boss' ? 20 : 10; // Larger blasts for boss
                            const bulletHeight = invader.type === 'boss' ? 20 : 10;
                            enemyBullets.push({
                                x: invader.x + invader.width / 2 - bulletWidth / 2,
                                y: invader.y + invader.height,
                                width: bulletWidth,
                                height: bulletHeight
                            });
                            invader.shootTimer = invader.type === 'robotDevil' ? Math.random() * 90 + 45 : Math.random() * 30 + 15;
                        }
                    }
                }
            });

            spawnPowerUp();
            powerUps.forEach((powerUp, index) => {
                powerUp.y += powerUp.dy;
                if (powerUp.y > canvas.height) {
                    powerUps.splice(index, 1);
                } else if (
                    powerUp.x < player.x + player.width &&
                    powerUp.x + powerUp.width > player.x &&
                    powerUp.y < player.y + player.height &&
                    powerUp.y + powerUp.height > player.y
                ) {
                    player.slurmCount++;
                    player.multiShot = player.slurmCount >= 2 ? 5 : Math.min(3, level);
                    player.multiShotTimer = 300;
                    powerUps.splice(index, 1);
                }
            });

            bullets.forEach((bullet, bIndex) => {
                invaders.forEach((invader, iIndex) => {
                    if (invader.alive && !invader.hitThisFrame &&
                        bullet.x < invader.x + invader.width &&
                        bullet.x + bullet.width > invader.x &&
                        bullet.y < invader.y + invader.height &&
                        bullet.y + bullet.height > invader.y) {
                        invader.health -= 1;
                        invader.hitThisFrame = true;
                        if (bullet.damage <= 4) bullets.splice(bIndex, 1);
                        if (invader.health <= 0) {
                            invader.alive = false;
                            player.score += invader.type === 'omicronian' ? 10 : invader.type === 'brainSlug' ? 20 : invader.type === 'robotDevil' ? 50 : 100;
                        }
                        return;
                    }
                });
            });

            const allDead = invaders.every(invader => !invader.alive);
            if (allDead) {
                level++;
                spawnInvaders();
            }

            if (player.health <= 0) {
                ctx.fillStyle = '#FFFFFF';
                ctx.font = '40px Arial';
                ctx.fillText('Game Over, Meatbag!', canvas.width / 2 - 150, canvas.height / 2);
                ctx.font = '20px Arial';
                ctx.fillText(`Final Score: ${player.score}`, canvas.width / 2 - 70, canvas.height / 2 + 40);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (backgroundLoaded) {
                ctx.drawImage(backgroundImg, 0, 0, canvas.width, canvas.height);
            }

            if (spacecraftLoaded) {
                ctx.drawImage(spacecraftImg, player.x, player.y, player.width, player.height);
            } else {
                ctx.fillStyle = '#00FF00';
                ctx.fillRect(player.x, player.y, player.width, player.height);
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText('Planet Express', player.x, player.y - 5);
            }

            if (isCharging) {
                ctx.fillStyle = '#FFFF00';
                ctx.fillRect(player.x, player.y - 10, Math.min(chargeTime * 2, 50), 5);
            }

            ctx.fillStyle = '#FF0000';
            ctx.fillRect(10, 50, 200, 20);
            ctx.fillStyle = '#00FF00';
            ctx.fillRect(10, 50, (player.health / player.maxHealth) * 200, 20);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = '16px Arial';
            ctx.fillText(`Health: ${player.health}`, 10, 45);

            invaders.forEach(invader => {
                if (invader.alive) {
                    if (invader.type === 'omicronian' && omicronianLoaded) {
                        ctx.drawImage(omicronianImg, invader.x, invader.y, invader.width, invader.height);
                    } else if (invader.type === 'brainSlug' && alienLoaded) {
                        ctx.drawImage(alienImg, invader.x, invader.y, invader.width, invader.height);
                    } else if (invader.type === 'robotDevil' && alien2Loaded) {
                        ctx.drawImage(alien2Img, invader.x, invader.y, invader.width, invader.height);
                    } else if (invader.type === 'boss' && bossLoaded) {
                        // Flip boss SVG upside down
                        ctx.save();
                        ctx.translate(invader.x + invader.width / 2, invader.y + invader.height / 2);
                        ctx.scale(1, -1); // Flip vertically
                        ctx.drawImage(bossImg, -invader.width / 2, -invader.height / 2, invader.width, invader.height);
                        ctx.restore();
                    } else if (invader.type === 'omicronian') {
                        ctx.fillStyle = '#FF00FF';
                        ctx.fillRect(invader.x, invader.y, invader.width, invader.height);
                    } else if (invader.type === 'brainSlug') {
                        ctx.fillStyle = '#00FFFF';
                        ctx.fillRect(invader.x, invader.y, invader.width, invader.height);
                    } else if (invader.type === 'robotDevil') {
                        ctx.fillStyle = '#FF4500';
                        ctx.fillRect(invader.x, invader.y, invader.width, invader.height);
                    } else { // Boss fallback
                        ctx.fillStyle = '#FF00FF';
                        ctx.fillRect(invader.x, invader.y, invader.width, invader.height);
                    }
                    if (invader.type === 'robotDevil' || invader.type === 'boss') {
                        ctx.fillStyle = '#FF0000';
                        ctx.fillRect(invader.x, invader.y - 10, invader.width, 5);
                        ctx.fillStyle = '#00FF00';
                        ctx.fillRect(invader.x, invader.y - 10, (invader.health / invader.maxHealth) * invader.width, 5);
                    }
                }
            });

            ctx.fillStyle = '#FFFF00';
            bullets.forEach(bullet => {
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            });

            ctx.fillStyle = '#FF0000';
            enemyBullets.forEach(bullet => {
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            });

            powerUps.forEach(powerUp => {
                if (blasterGunLoaded) {
                    ctx.drawImage(blasterGunImg, powerUp.x, powerUp.y, powerUp.width, powerUp.height);
                } else {
                    ctx.fillStyle = '#00FF00';
                    ctx.fillRect(powerUp.x, powerUp.y, powerUp.width, powerUp.height);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillText('Slurm', powerUp.x, powerUp.y - 5);
                }
            });

            ctx.fillStyle = '#FFFFFF';
            ctx.font = '20px Arial';
            ctx.fillText(`Level: ${level}`, 10, 30);
            ctx.fillText(`Score: ${player.score}`, 10, 90);
            ctx.fillText(`Slurm Cans: ${player.slurmCount}`, 10, 110);
            if (player.multiShotTimer > 0) {
                ctx.fillText(`Multi-Shot: ${player.multiShot}`, 10, 70);
            }

            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
